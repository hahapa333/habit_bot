version: "3.8"
services:
  db:
    container_name: "postgres"
    image: postgres:14.1-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - backend

  fastapi:
    container_name: "fastapi"
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --reload --host ${WEBAPP_HOST} --port ${WEBAPP_PORT} & python app/main.py
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/code
    environment:
      PYTHONPATH: /code
    working_dir: /code
    networks:
      - backend



